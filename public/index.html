<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GDL — Discovery Bridges</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,300;0,400;0,500;0,700;1,300&family=Barlow+Condensed:wght@300;400;700;900&display=swap" rel="stylesheet" />
<style>
  /* GDL restraint variant of the johnmills Swiss system.
     "No color for GDL — a tool staying out of its own way." Red is used sparingly:
     one structural accent, plus the status signal (green = live, red = offline). */
  :root{
    --black:#0a0a0a; --white:#f5f4f0; --red:#d42b2b;
    --g1:#1e1e1e; --g2:#444; --g3:#888; --g4:#bbb; --g5:#ddd;
    --green:#1f7a3d;
    --fc:'Barlow Condensed',sans-serif; --fb:'Barlow',sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-font-smoothing:antialiased;height:100%;}
  body{height:100%;background:var(--white);color:var(--black);font-family:var(--fb);font-size:15px;line-height:1.6;overflow:hidden;}
  /* Fixed shell: header and composer are locked; only .thread scrolls between them. */
  .wrap{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:0 24px;overflow:hidden;}

  /* HEADER — locked at top. The one sparing decorative red: the bottom rule. */
  header{flex:0 0 auto;border-bottom:3px solid var(--red);padding:28px 0 20px;background:var(--white);}
  .head-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;}
  .brand{font-family:var(--fc);font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:0.01em;}
  .brand span{color:var(--g3);font-weight:700;}
  .restart{background:none;border:none;color:var(--g3);font-family:var(--fc);font-weight:700;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;padding:0;white-space:nowrap;transition:color .12s;}
  .restart:hover{color:var(--black);}
  .tag{font-family:var(--fc);font-weight:700;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--g3);margin-top:8px;}
  .badge{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-family:var(--fc);font-weight:700;font-size:10px;letter-spacing:0.15em;border:1px solid var(--g5);padding:5px 10px;color:var(--g3);text-transform:uppercase;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--g4);}
  /* status color logic: green when live, red when off */
  .badge.live .dot{background:var(--green);}
  .badge.live{color:var(--black);border-color:var(--g3);}
  .badge.off .dot{background:var(--red);}
  .badge.off{color:var(--g2);border-color:var(--g4);}

  /* THREAD — the only scrolling region */
  .thread{flex:1 1 auto;overflow-y:auto;padding:24px 0;display:flex;flex-direction:column;gap:0;}
  .msg{padding:22px 0;border-bottom:1px solid var(--g5);}
  .msg .who{font-family:var(--fc);font-weight:700;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--g3);margin-bottom:10px;display:flex;align-items:center;gap:10px;}
  .msg.you .who{color:var(--g4);}
  .msg .who::before{content:"";width:20px;height:2px;background:var(--black);display:inline-block;}
  .msg.you .who::before{background:var(--g4);}
  .bubble{font-family:var(--fb);font-size:16px;line-height:1.72;white-space:pre-wrap;color:var(--g1);}
  .msg.you .bubble{color:var(--g2);font-weight:300;}
  .msg.sys .bubble{color:var(--black);}
  .typing .bubble{color:var(--g3);font-family:var(--fc);font-weight:400;letter-spacing:0.08em;text-transform:uppercase;font-size:13px;}

  /* COMPOSER — locked at bottom, one soft unified block */
  .composer{flex:0 0 auto;background:var(--white);padding:14px 0 22px;}
  .inputblock{display:flex;align-items:flex-end;gap:8px;background:#fff;border:1px solid var(--g4);border-radius:22px;padding:6px 6px 6px 18px;transition:border-color .12s,box-shadow .12s;}
  .inputblock:focus-within{border-color:var(--g2);box-shadow:0 1px 6px rgba(0,0,0,0.06);}
  textarea{flex:1;background:transparent;border:none;color:var(--black);font-family:var(--fb);font-size:15px;line-height:1.5;padding:8px 0;outline:none;resize:none;max-height:140px;min-height:24px;}
  textarea::placeholder{color:var(--g4);}
  .send{font-family:var(--fb);font-weight:500;font-size:18px;line-height:1;background:var(--g4);color:#fff;border:none;border-radius:50%;width:38px;height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;}
  .send.ready{background:var(--black);}
  .send.ready:hover{background:var(--g1);}
  .send:disabled{cursor:default;}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--g5);border-top-color:var(--black);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:8px;}
  @keyframes sp{to{transform:rotate(360deg);}}

  @media (max-width:860px){ .wrap{padding:0 18px;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div class="brand">GDL <span>/ Discovery Bridges</span></div>
      <button id="restart" class="restart">Start over</button>
    </div>
    <div class="tag">Find your next read</div>
    <div id="badge" class="badge"><span class="dot"></span><span id="badge-text">Checking…</span></div>
  </header>

  <div id="thread" class="thread"></div>

  <div class="composer">
    <div class="inputblock">
      <textarea id="input" placeholder="Name a book you love." rows="1"></textarea>
      <button id="send" class="send" aria-label="Send">&uarr;</button>
    </div>
  </div>
</div>

<script>
const $ = (id)=>document.getElementById(id);
let mode="unknown";
let history=[];
let busy=false;

async function detectMode(){
  try{ const r=await fetch("/api/health"); const h=await r.json();
    setMode(h.ok && h.keyConfigured ? "live":"offline");
  }catch{ setMode("offline"); }
}
function setMode(m){
  mode=m; const b=$("badge"), t=$("badge-text");
  b.classList.remove("live","off");
  if(m==="live"){ b.classList.add("live"); t.textContent="Live — reasoning on"; }
  else{ b.classList.add("off"); t.textContent="Offline — tagged catalog"; }
}

function addMsg(role, text){
  const el=document.createElement("div");
  el.className="msg "+(role==="assistant"?"sys":"you");
  el.innerHTML='<div class="who">'+(role==="assistant"?"GDL":"You")+'</div><div class="bubble"></div>';
  el.querySelector(".bubble").textContent=text;
  $("thread").appendChild(el); scroll(); return el;
}
function addTyping(){
  const el=document.createElement("div");
  el.className="msg sys typing";
  el.innerHTML='<div class="who">GDL</div><div class="bubble"><span class="spin"></span>tracing the thread…</div>';
  $("thread").appendChild(el); scroll(); return el;
}
function scroll(){ const t=$("thread"); t.scrollTop=t.scrollHeight; }

async function send(text){
  if(busy) return;
  text=(text||$("input").value).trim();
  if(!text) return;
  busy=true; $("send").disabled=true; $("input").value=""; autosize(); syncSend();
  addMsg("user",text);
  history.push({role:"user",content:text});
  const typing=addTyping();

  let reply=null, wentOffline=false, errDetail="";
  if(mode==="live"){
    try{
      const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({messages:history})});
      const data=await r.json().catch(()=>({}));
      if(!r.ok){ errDetail=(data && (data.message||data.error))||("status "+r.status); throw new Error(errDetail); }
      reply=(data && typeof data.reply==="string") ? data.reply.trim() : "";
      if(!reply){ errDetail="empty reply from server"; throw new Error(errDetail); }
    }catch(e){ wentOffline=true; if(!errDetail) errDetail=e.message||"request failed"; }
  } else { wentOffline=true; }

  if(wentOffline){ setMode("offline"); reply=offlineReply(text); }
  typing.remove();
  addMsg("assistant",reply);
  history.push({role:"assistant",content:reply});
  busy=false; syncSend(); $("input").focus();
}

const POOL=[
  {t:"The Feather Thief",a:"Kirk Wallace Johnson",tags:["obsession","rare things","crime","nature"],d:2,s:2},
  {t:"The Orchid Thief",a:"Susan Orlean",tags:["obsession","rare things","eccentrics","nature"],d:2,s:2},
  {t:"The Dragon Behind the Glass",a:"Emily Voigt",tags:["obsession","rare things","adventure"],d:2,s:2},
  {t:"The Botany of Desire",a:"Michael Pollan",tags:["nature","ideas","commerce"],d:3,s:2},
  {t:"The Cabaret of Plants",a:"Richard Mabey",tags:["nature","beauty","eccentrics","myth"],d:3,s:3},
  {t:"Into the Wild",a:"Jon Krakauer",tags:["adventure","outsiders","loss"],d:2,s:2},
  {t:"The Immortal Life of Henrietta Lacks",a:"Rebecca Skloot",tags:["nature","moral weight","commerce"],d:3,s:1},
  {t:"The Emperor of All Maladies",a:"Siddhartha Mukherjee",tags:["nature","systems","moral weight"],d:4,s:1},
  {t:"Stiff",a:"Mary Roach",tags:["nature","dread","forbidden"],d:2,s:3},
  {t:"The Sixth Extinction",a:"Elizabeth Kolbert",tags:["nature","moral weight","loss"],d:3,s:1},
  {t:"Food of the Gods",a:"Terence McKenna",tags:["altered states","ideas","connections"],d:3,s:4},
  {t:"The Doors of Perception",a:"Aldous Huxley",tags:["altered states","consciousness","beauty"],d:3,s:3},
  {t:"VALIS",a:"Philip K. Dick",tags:["connections","consciousness","myth","outsiders"],d:3,s:5},
  {t:"Godel, Escher, Bach",a:"Douglas Hofstadter",tags:["connections","systems","consciousness"],d:5,s:3},
  {t:"The Master and Margarita",a:"Mikhail Bulgakov",tags:["myth","moral weight","connections"],d:4,s:4},
  {t:"House of Leaves",a:"Mark Z. Danielewski",tags:["dread","connections","loss"],d:4,s:5},
  {t:"Annihilation",a:"Jeff VanderMeer",tags:["dread","rare things","consciousness","nature"],d:3,s:5},
  {t:"The Peregrine",a:"J.A. Baker",tags:["beauty","nature","loss","rare things"],d:4,s:3},
  {t:"Blood Meridian",a:"Cormac McCarthy",tags:["moral weight","adventure","beauty","dread"],d:4,s:3},
  {t:"Pilgrim at Tinker Creek",a:"Annie Dillard",tags:["nature","beauty","consciousness","dread"],d:4,s:3},
  {t:"The Soul of an Octopus",a:"Sy Montgomery",tags:["rare things","consciousness","beauty","nature"],d:2,s:2},
  {t:"Musicophilia",a:"Oliver Sacks",tags:["consciousness","eccentrics","systems","loss"],d:3,s:2},
];
let offlineShown=new Set();
function offlineReply(text){
  const low=text.toLowerCase();
  const wantStranger=/strange|weird|stranger|wild|out there/.test(low);
  const wantDeeper=/deep|demanding|serious|rigor|academic|harder/.test(low);
  const already=/read it|know it|already/.test(low);
  let pick=POOL.filter(b=>!offlineShown.has(b.t))
    .sort((x,y)=> wantStranger ? y.s-x.s : wantDeeper ? y.d-x.d : (y.d+y.s)-(x.d+x.s))[0] || POOL[0];
  offlineShown.add(pick.t);
  const lead = history.length<=1
    ? "The thread underneath: "
    : already ? "Already read. Alternate: "
    : wantStranger ? "Further out: "
    : wantDeeper ? "More demanding: "
    : "Another vector: ";
  const known = history.length<=1
    ? "obsession pursued past reason. \u201C"
    : "\u201C";
  return lead + known + pick.t + "\u201D by " + pick.a + ". Preserves the thread; changes the surface. "
    + "[Offline mode — tagged catalog of 22. Live reasoning ranges wider.]";
}

function autosize(){ const i=$("input"); i.style.height="auto"; i.style.height=Math.min(i.scrollHeight,140)+"px"; }
function syncSend(){ const has=$("input").value.trim().length>0; const b=$("send"); b.classList.toggle("ready",has); b.disabled=!has; }
$("input").addEventListener("input",()=>{ autosize(); syncSend(); });
$("input").addEventListener("keydown",(e)=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }});
$("send").onclick=()=>send();
$("restart").onclick=()=>{ history=[]; offlineShown=new Set(); $("thread").innerHTML=""; greet(); };

function greet(){
  addMsg("assistant","Name a book. Then name what actually stayed with you — not the genre, the thing underneath it. The result continues that thread instead of matching the subject.\n\nPush back freely as it goes: \u201Ctoo dark,\u201D \u201Cread it,\u201D \u201Cgo stranger,\u201D \u201Cless academic.\u201D Each note changes what comes next.");
}

detectMode();
greet();
syncSend();
</script>
</body>
</html>
